name: Build Windows

on:
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or commit to build; empty uses the triggering commit
        type: string
        default: ''
      release-tag:
        description: If set, must equal v followed by the Cargo package version
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      EXPECTED_RELEASE_TAG: ${{ inputs.release-tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Check package version and release tag
        run: ./scripts/package.ps1 -ExpectedTag $env:EXPECTED_RELEASE_TAG -ValidateOnly

      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Cache Rust dependencies and build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: windows-msvc-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            windows-msvc-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml') }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests and build the release executables
        run: ./scripts/build.ps1

      - name: Package executables, portable ZIP and SHA-256 checksums
        run: ./scripts/package.ps1 -ExpectedTag $env:EXPECTED_RELEASE_TAG

      - name: Upload Windows build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
