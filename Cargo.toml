[package]
name = "kkt-saver"
version = "2.5.4"
edition = "2024"
default-run = "kkt-saver"
description = "Сохранение и печать карточек регистрации и снятия ККТ"
license = "MIT"

[dependencies]
anyhow = "1.0"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
libloading = "0.9"
regex = "1.12"
raw-window-handle = "0.6.2"
rfd = "0.15.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
strsim = "0.11"
tempfile = "3.23"
tray-icon = "0.21"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[patch.crates-io]
# Backport the Windows event-loop wait fix; see vendor/eframe/LOCAL-PATCHES.md.
eframe = { path = "vendor/eframe" }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
panic = "unwind"
